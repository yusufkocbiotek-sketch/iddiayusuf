<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İddaa Oranları - Analiz & Bülten</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0d1117;color:#e6e6e6;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f2e,#0d1117);padding:15px 20px;border-bottom:2px solid #00c853;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:22px;color:#00c853}
.header .info{font-size:11px;color:#666;text-align:right}

/* TABS */
.main-tabs{display:flex;background:#161b22;border-bottom:1px solid #21262d}
.main-tab{flex:1;text-align:center;padding:12px;cursor:pointer;font-size:14px;font-weight:600;color:#888;border-bottom:3px solid transparent;transition:all .2s}
.main-tab:hover{color:#e6e6e6;background:#1a2233}
.main-tab.aktif{color:#00c853;border-bottom-color:#00c853;background:#0d1117}
.tab-icerik{display:none}
.tab-icerik.aktif{display:block}

/* STATS */
.stats-bar{background:#161b22;padding:12px 20px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #21262d;overflow-x:auto}
.si{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;min-width:80px}
.si .sv{font-size:18px;font-weight:700;color:#00c853}
.si .sl{font-size:10px;color:#888;margin-top:2px}

/* FILTERS */
.filters{background:#161b22;padding:12px 20px;border-bottom:1px solid #21262d}
.fr{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fr:last-child{margin-bottom:0}
.filters input,.filters select{background:#0d1117;color:#e6e6e6;border:1px solid #30363d;padding:7px 10px;border-radius:6px;font-size:12px;outline:none}
.filters input:focus,.filters select:focus{border-color:#00c853}
.filters input[type=text]{min-width:180px;flex:1;max-width:280px}
.filters input[type=number]{width:75px}
.fl{font-size:11px;color:#888;white-space:nowrap}
.fb{font-size:11px;color:#00c853;font-weight:700;white-space:nowrap}
.btn-r{background:#21262d;color:#e6e6e6;border:1px solid #30363d;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-r:hover{background:#30363d}
.btn-a{background:#00c853;color:#0d1117;border:none;padding:7px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.btn-a:hover{background:#00e676}
.ofk{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ANALIZ */
.analiz-panel{background:#161b22;padding:20px;margin:10px 15px;border-radius:10px;border:1px solid #21262d}
.analiz-baslik{font-size:16px;color:#00c853;font-weight:700;margin-bottom:15px;display:flex;align-items:center;gap:8px}
.analiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:15px}
.analiz-kart{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:15px;text-align:center}
.analiz-kart .ak-baslik{font-size:11px;color:#888;margin-bottom:5px}
.analiz-kart .ak-deger{font-size:28px;font-weight:700;color:#f0b90b}
.analiz-kart .ak-alt{font-size:11px;color:#00c853;margin-top:3px}
.analiz-bar{margin-bottom:12px}
.analiz-bar-baslik{font-size:12px;color:#ccc;margin-bottom:4px;display:flex;justify-content:space-between}
.analiz-bar-ic{background:#21262d;height:24px;border-radius:4px;overflow:hidden;display:flex}
.ab-ev{background:#00c853;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0d1117;transition:width .5s}
.ab-ber{background:#f0b90b;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0d1117;transition:width .5s}
.ab-dep{background:#e74c3c;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;transition:width .5s}
.analiz-maclar{margin-top:15px}
.analiz-mac{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:8px 12px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.analiz-mac .am-takim{flex:1}
.analiz-mac .am-skor{font-weight:700;font-size:14px;min-width:50px;text-align:center}
.analiz-mac .am-skor.ev-kazandi{color:#00c853}
.analiz-mac .am-skor.berabere{color:#f0b90b}
.analiz-mac .am-skor.dep-kazandi{color:#e74c3c}
.analiz-mac .am-oran{color:#f0b90b;min-width:50px;text-align:right}
.analiz-mac .am-tarih{color:#555;min-width:80px;text-align:right}
.analiz-yok{text-align:center;padding:30px;color:#666}
.analiz-input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}
.analiz-input-row input,.analiz-input-row select{background:#0d1117;color:#e6e6e6;border:1px solid #30363d;padding:8px 12px;border-radius:6px;font-size:13px;outline:none}
.analiz-input-row input:focus,.analiz-input-row select:focus{border-color:#00c853}
.analiz-input-row input[type=number]{width:80px}

/* MACLAR */
.container{padding:10px 15px;max-width:1400px;margin:0 auto}
.gun-h{background:#161b22;border:1px solid #21262d;border-radius:8px 8px 0 0;padding:10px 15px;margin-top:12px;font-size:13px;font-weight:700;color:#00c853;display:flex;justify-content:space-between}
.gun-h .gc{background:#00c853;color:#0d1117;padding:2px 8px;border-radius:10px;font-size:11px}
.mac{background:#161b22;border:1px solid #21262d;margin-bottom:1px}
.mac:last-child{border-radius:0 0 8px 8px}
.mac:hover{border-color:#30363d}
.mac-row{display:grid;grid-template-columns:60px 1fr auto 25px;align-items:center;padding:10px 12px;cursor:pointer;gap:8px}
.ms{display:flex;flex-direction:column;align-items:center}
.ms .s{color:#00c853;font-weight:700;font-size:14px}
.ms .t{color:#555;font-size:9px}
.ms .k{color:#444;font-size:9px}
.mt{display:flex;flex-direction:column;gap:1px}
.mt .ev{font-size:13px;font-weight:600}
.mt .dep{font-size:12px;color:#999}
.mo{display:flex;gap:3px;flex-wrap:wrap}
.ok{display:flex;flex-direction:column;align-items:center;background:#0d1117;border:1px solid #21262d;border-radius:4px;padding:3px 5px;min-width:40px}
.ok:hover{border-color:#00c853}
.ok .ol{font-size:7px;color:#666}
.ok .ov{font-size:12px;font-weight:700;color:#f0b90b}
.ok .op{font-size:7px;color:#00c853}
.pb{display:flex;height:3px;border-radius:2px;overflow:hidden;width:100%;grid-column:1/-1;margin-top:2px}
.p1{background:#00c853}.ppx{background:#f0b90b}.p2{background:#e74c3c}
.ma{text-align:center;color:#444;font-size:14px;transition:transform .3s}
.ma.open{transform:rotate(180deg);color:#00c853}
.detay{display:none;background:#0d1117;border-top:1px solid #21262d;padding:12px}
.detay.acik{display:block}
.dtabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.dtab{background:#161b22;border:1px solid #21262d;color:#888;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px}
.dtab:hover,.dtab.a{background:#00c853;color:#0d1117;border-color:#00c853;font-weight:700}
.dcon{display:none}.dcon.a{display:block}
.dg{margin-bottom:8px}
.dgb{color:#00c853;font-size:11px;font-weight:700;padding:4px 0;border-bottom:1px solid #21262d;margin-bottom:4px}
.ds{display:flex;flex-wrap:wrap;gap:3px}
.dor{display:flex;flex-direction:column;align-items:center;background:#161b22;border:1px solid #21262d;border-radius:4px;padding:4px 6px;min-width:58px}
.dor:hover{border-color:#00c853;background:#1a2233}
.dor .dl{font-size:8px;color:#888}
.dor .dv{font-size:12px;font-weight:700;color:#f0b90b}
.dor .dp{font-size:7px;color:#00c853}

.loading{text-align:center;padding:80px}
.spinner{width:40px;height:40px;border:4px solid #21262d;border-top:4px solid #00c853;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 15px}
@keyframes spin{to{transform:rotate(360deg)}}
.bos{text-align:center;padding:40px;color:#666}
.hata{text-align:center;padding:60px;color:#e74c3c}
.footer{background:#161b22;border-top:1px solid #21262d;padding:12px 20px;text-align:center;font-size:11px;color:#444;margin-top:20px}
.hl{background:#1a3a1a !important;border-color:#00c853 !important}

@media(max-width:768px){
.mac-row{grid-template-columns:50px 1fr auto 25px;gap:6px}
.header h1{font-size:16px}
.fr{flex-direction:column;align-items:stretch}
.filters input[type=text]{max-width:100%;width:100%}
.ofk{flex-direction:column;align-items:stretch}
.analiz-grid{grid-template-columns:1fr 1fr}
.analiz-input-row{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<div class="header">
<h1>⚽ İddaa Oranları & Analiz</h1>
<div class="info" id="info">Yükleniyor...</div>
</div>

<div class="main-tabs">
<div class="main-tab aktif" onclick="mainTab(0)">📋 Bülten</div>
<div class="main-tab" onclick="mainTab(1)">📊 Oran Analizi</div>
</div>

<!-- TAB 1: BÜLTEN -->
<div class="tab-icerik aktif" id="tab0">
<div class="stats-bar" id="statsBar"></div>
<div class="filters">
<div class="fr">
<input type="text" id="aramaInput" placeholder="🔍 Takım veya lig ara..." oninput="filtrele()">
<select id="tarihSelect" onchange="filtrele()"><option value="">📅 Tüm Tarihler</option></select>
<select id="ligSelect" onchange="filtrele()"><option value="">🏆 Tüm Ligler</option></select>
<select id="durumSelect" onchange="filtrele()">
<option value="">📌 Tüm Durumlar</option>
<option value="baslamadi">Başlamadı</option>
<option value="bitti">Bitti</option>
</select>
<select id="siralama" onchange="filtrele()">
<option value="tarih">Tarihe Göre</option>
<option value="ms1a">MS 1 ↑</option><option value="ms1d">MS 1 ↓</option>
<option value="ms2a">MS 2 ↑</option><option value="ms2d">MS 2 ↓</option>
<option value="usta">Üst 2.5 ↑</option><option value="alta">Alt 2.5 ↑</option>
</select>
<button class="btn-r" onclick="resetFiltre()">↺ Sıfırla</button>
</div>
<div class="fr">
<span class="fb">📊 Oran Filtresi:</span>
<div class="ofk">
<select id="oranTuru" onchange="filtrele()"><option value="">Oran Türü...</option>
<option value="Maç Sonucu_1">MS 1</option><option value="Maç Sonucu_0">MS X</option><option value="Maç Sonucu_2">MS 2</option>
<option value="Alt/Üst 2.5_Alt">Alt 2.5</option><option value="Alt/Üst 2.5_Üst">Üst 2.5</option>
<option value="Karşılıklı Gol_Var">KG Var</option><option value="Karşılıklı Gol_Yok">KG Yok</option>
<option value="İY Sonuç_1">İY 1</option><option value="İY Sonuç_0">İY X</option><option value="İY Sonuç_2">İY 2</option>
</select>
<span class="fl">Min:</span><input type="number" id="oranMin" step="0.01" placeholder="1.00" oninput="filtrele()">
<span class="fl">Max:</span><input type="number" id="oranMax" step="0.01" placeholder="10.00" oninput="filtrele()">
</div>
</div>
</div>
<div class="container" id="container"><div class="loading"><div class="spinner"></div><p>Yükleniyor...</p></div></div>
</div>

<!-- TAB 2: ANALİZ -->
<div class="tab-icerik" id="tab1">
<div class="analiz-panel">
<div class="analiz-baslik">📊 Oran Analizi — Biten Maç İstatistikleri</div>
<div class="analiz-input-row">
<select id="analizOranTuru">
<option value="Maç Sonucu_1">MS 1 (Ev Sahibi)</option>
<option value="Maç Sonucu_0">MS X (Beraberlik)</option>
<option value="Maç Sonucu_2">MS 2 (Deplasman)</option>
<option value="Alt/Üst 2.5_Alt">Alt 2.5</option>
<option value="Alt/Üst 2.5_Üst">Üst 2.5</option>
<option value="Karşılıklı Gol_Var">KG Var</option>
<option value="Karşılıklı Gol_Yok">KG Yok</option>
<option value="İY Sonuç_1">İY 1</option>
<option value="İY Sonuç_0">İY X</option>
<option value="İY Sonuç_2">İY 2</option>
</select>
<span class="fl">Oran =</span>
<input type="number" id="analizOran" step="0.01" placeholder="1.50" value="">
<span class="fl">Tolerans ±</span>
<input type="number" id="analizTolerans" step="0.05" placeholder="0.10" value="0.10">
<button class="btn-a" onclick="analizYap()">🔍 Analiz Et</button>
</div>
<div id="analizSonuc"><div class="analiz-yok">👆 Oran türünü seçin, değer girin ve Analiz Et'e tıklayın</div></div>
</div>
</div>

<div class="footer" id="footer"></div>

<script>
const JSON_URL="https://raw.githubusercontent.com/yusufkocbiotek-sketch/iddiayusuf/main/public/data/mac.json";
let tumMaclar=[];

async function yukle(){
try{
const r=await fetch(JSON_URL+"?t="+Date.now());
const d=await r.json();
tumMaclar=d.matches||[];
document.getElementById("info").innerHTML="Son: "+new Date(d.updated).toLocaleString("tr-TR")+"<br>iddaa.com";
tarihleriDoldur();ligleriDoldur();filtrele();
}catch(e){document.getElementById("container").innerHTML='<div class="hata">❌ '+e.message+'</div>'}}

function tarihleriDoldur(){
const t=[...new Set(tumMaclar.map(m=>m.tarih))].sort();
const s=document.getElementById("tarihSelect");
t.forEach(tarih=>{const o=document.createElement("option");o.value=tarih;
const d=new Date(tarih);o.textContent=d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"short"});s.appendChild(o)})}

function ligleriDoldur(){
const l=[...new Set(tumMaclar.map(m=>m.lig||"").filter(x=>x.trim()))].sort();
const s=document.getElementById("ligSelect");
l.forEach(lig=>{const o=document.createElement("option");o.value=lig;o.textContent=lig;s.appendChild(o)})}

function pct(o){return o&&o>0?Math.round(1/o*10000)/100:0}

function mainTab(idx){
document.querySelectorAll(".main-tab").forEach((t,i)=>t.classList.toggle("aktif",i===idx));
document.querySelectorAll(".tab-icerik").forEach((t,i)=>t.classList.toggle("aktif",i===idx))}

// ==================== BÜLTEN ====================
function filtrele(){
const arama=document.getElementById("aramaInput").value.toLowerCase();
const tarih=document.getElementById("tarihSelect").value;
const lig=document.getElementById("ligSelect").value;
const durum=document.getElementById("durumSelect").value;
const sira=document.getElementById("siralama").value;
const oranTuru=document.getElementById("oranTuru").value;
const oranMin=parseFloat(document.getElementById("oranMin").value)||0;
const oranMax=parseFloat(document.getElementById("oranMax").value)||999;

let sonuc=tumMaclar.filter(m=>{
if(arama&&!m.ev_sahibi.toLowerCase().includes(arama)&&!m.deplasman.toLowerCase().includes(arama)&&!(m.lig||"").toLowerCase().includes(arama))return false;
if(tarih&&m.tarih!==tarih)return false;
if(lig&&(m.lig||"")!==lig)return false;
if(durum&&m.durum!==durum)return false;
if(oranTuru){const v=m.oranlar[oranTuru];if(!v||v<oranMin||v>oranMax)return false}
return true});

const g=v=>v||99;
if(sira==="ms1a")sonuc.sort((a,b)=>g(a.oranlar["Maç Sonucu_1"])-g(b.oranlar["Maç Sonucu_1"]));
else if(sira==="ms1d")sonuc.sort((a,b)=>g(b.oranlar["Maç Sonucu_1"])-g(a.oranlar["Maç Sonucu_1"]));
else if(sira==="ms2a")sonuc.sort((a,b)=>g(a.oranlar["Maç Sonucu_2"])-g(b.oranlar["Maç Sonucu_2"]));
else if(sira==="ms2d")sonuc.sort((a,b)=>g(b.oranlar["Maç Sonucu_2"])-g(a.oranlar["Maç Sonucu_2"]));
else if(sira==="usta")sonuc.sort((a,b)=>g(a.oranlar["Alt/Üst 2.5_Üst"])-g(b.oranlar["Alt/Üst 2.5_Üst"]));
else if(sira==="alta")sonuc.sort((a,b)=>g(a.oranlar["Alt/Üst 2.5_Alt"])-g(b.oranlar["Alt/Üst 2.5_Alt"]));
else sonuc.sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));
statsGoster(sonuc);render(sonuc)}

function resetFiltre(){
["aramaInput","oranMin","oranMax"].forEach(id=>document.getElementById(id).value="");
["tarihSelect","ligSelect","durumSelect","oranTuru"].forEach(id=>document.getElementById(id).value="");
document.getElementById("siralama").value="tarih";filtrele()}

function statsGoster(m){
const to=m.reduce((t,x)=>t+Object.keys(x.oranlar).length,0);
const bitti=m.filter(x=>x.durum==="bitti").length;
const baslamadi=m.filter(x=>x.durum==="baslamadi").length;
document.getElementById("statsBar").innerHTML=
'<div class="si"><div class="sv">'+m.length+'</div><div class="sl">Maç</div></div>'+
'<div class="si"><div class="sv">'+to.toLocaleString()+'</div><div class="sl">Oran</div></div>'+
'<div class="si"><div class="sv">'+bitti+'</div><div class="sl">Biten</div></div>'+
'<div class="si"><div class="sv">'+baslamadi+'</div><div class="sl">Başlamadı</div></div>'+
'<div class="si"><div class="sv">'+new Set(m.map(x=>x.tarih)).size+'</div><div class="sl">Gün</div></div>'}

function render(maclar){
if(!maclar.length){document.getElementById("container").innerHTML='<div class="bos">🔍 Sonuç yok</div>';return}
const grp={};maclar.forEach(m=>{if(!grp[m.tarih])grp[m.tarih]=[];grp[m.tarih].push(m)});
let h="";
Object.keys(grp).sort().forEach(tarih=>{
const gm=grp[tarih];
const d=new Date(tarih);
h+='<div class="gun-h">📅 '+d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"long"})+'<span class="gc">'+gm.length+'</span></div>';
gm.forEach((m,idx)=>{
const o=m.oranlar;const id="d"+tarih.replace(/-/g,"")+idx;
const ms1=o["Maç Sonucu_1"]||0,ms0=o["Maç Sonucu_0"]||0,ms2=o["Maç Sonucu_2"]||0;
const p1=pct(ms1),px=pct(ms0),p2=pct(ms2);
const skorTxt=m.durum==="bitti"?'<span style="color:#f0b90b;font-weight:700;font-size:13px"> '+m.skor_ev+'-'+m.skor_dep+'</span>':"";

h+='<div class="mac">';
h+='<div class="mac-row" onclick="dtoggle(\''+id+'\')">';
h+='<div class="ms"><span class="s">'+m.saat+'</span><span class="t">'+m.tarih.substring(5)+'</span><span class="k">#'+(m.mac_kodu||"")+'</span></div>';
h+='<div class="mt"><span class="ev">'+m.ev_sahibi+skorTxt+'</span><span class="dep">'+m.deplasman+'</span></div>';
h+='<div class="mo">';
if(ms1){h+=okk("1",ms1,p1)+okk("X",ms0,px)+okk("2",ms2,p2)}
const au_a=o["Alt/Üst 2.5_Alt"],au_u=o["Alt/Üst 2.5_Üst"];
if(au_a)h+=okk("Alt",au_a,pct(au_a))+okk("Üst",au_u,pct(au_u));
const kg_v=o["Karşılıklı Gol_Var"],kg_y=o["Karşılıklı Gol_Yok"];
if(kg_v)h+=okk("KGV",kg_v,"")+okk("KGY",kg_y,"");
h+='</div>';
h+='<div class="ma" id="aw'+id+'">▼</div></div>';
if(ms1)h+='<div class="pb"><div class="p1" style="width:'+p1+'%"></div><div class="ppx" style="width:'+px+'%"></div><div class="p2" style="width:'+p2+'%"></div></div>';

// DETAY
h+='<div class="detay" id="'+id+'">';
const gr={};Object.keys(o).forEach(k=>{if(k==="Handikap")return;const ps=k.split("_");
let g=ps.length>1?ps[0]:"Genel";const l=ps.length>1?ps.slice(1).join(" "):ps[0];
if(!gr[g])gr[g]=[];gr[g].push({l,v:o[k],p:pct(o[k])})});
const gn=Object.keys(gr);
h+='<div class="dtabs">';gn.forEach((g,i)=>h+='<div class="dtab'+(i===0?" a":"")+'" onclick="tc(\''+id+'\','+i+')">'+g+' ('+gr[g].length+')</div>');h+='</div>';
gn.forEach((g,i)=>{h+='<div class="dcon'+(i===0?" a":"")+'" id="'+id+'t'+i+'"><div class="dg"><div class="dgb">'+g+'</div><div class="ds">';
gr[g].forEach(item=>{h+='<div class="dor"><span class="dl">'+item.l+'</span><span class="dv">'+item.v+'</span>';
if(item.p>0&&item.p<100)h+='<span class="dp">%'+item.p+'</span>';h+='</div>'});
h+='</div></div></div>'});
h+='</div></div>'})});
document.getElementById("container").innerHTML=h;
document.getElementById("footer").textContent=maclar.length+" maç | iddaa.com | "+new Date().toLocaleDateString("tr-TR")}

function okk(l,v,p){return'<div class="ok"><span class="ol">'+l+'</span><span class="ov">'+v+'</span>'+(p?'<span class="op">%'+p+'</span>':'')+'</div>'}
function dtoggle(id){document.getElementById(id).classList.toggle("acik");document.getElementById("aw"+id).classList.toggle("open")}
function tc(id,ti){const p=document.getElementById(id);p.querySelectorAll(".dtab").forEach((t,i)=>t.classList.toggle("a",i===ti));p.querySelectorAll(".dcon").forEach((c,i)=>c.classList.toggle("a",i===ti))}

// ==================== ANALİZ ====================
function analizYap(){
const oranTuru=document.getElementById("analizOranTuru").value;
const oranDeger=parseFloat(document.getElementById("analizOran").value);
const tolerans=parseFloat(document.getElementById("analizTolerans").value)||0.10;

if(!oranDeger||isNaN(oranDeger)){
document.getElementById("analizSonuc").innerHTML='<div class="analiz-yok">⚠️ Lütfen bir oran değeri girin (örn: 1.50)</div>';return}

// Biten maçları filtrele
const bitenMaclar=tumMaclar.filter(m=>{
if(m.durum!=="bitti")return false;
const val=m.oranlar[oranTuru];
if(!val)return false;
return Math.abs(val-oranDeger)<=tolerans});

if(bitenMaclar.length===0){
document.getElementById("analizSonuc").innerHTML='<div class="analiz-yok">❌ Bu oran aralığında biten maç bulunamadı.<br>Toleransı artırmayı deneyin (±0.20, ±0.50)</div>';return}

// İstatistikler
let evKazandi=0,berabere=0,depKazandi=0,ust25=0,alt25=0,kgVar=0,kgYok=0;
let iy_ev=0,iy_ber=0,iy_dep=0;
let toplamGol=0;

bitenMaclar.forEach(m=>{
const se=m.skor_ev||0,sd=m.skor_dep||0;
const toplam=se+sd;
toplamGol+=toplam;
if(se>sd)evKazandi++;else if(se===sd)berabere++;else depKazandi++;
if(toplam>2.5)ust25++;else alt25++;
if(se>0&&sd>0)kgVar++;else kgYok++;
// İY skorları
const iy_se=m.skor_1y_ev||0,iy_sd=m.skor_1y_dep||0;
if(iy_se>iy_sd)iy_ev++;else if(iy_se===iy_sd)iy_ber++;else iy_dep++});

const n=bitenMaclar.length;
const evP=Math.round(evKazandi/n*100);
const berP=Math.round(berabere/n*100);
const depP=Math.round(depKazandi/n*100);
const ustP=Math.round(ust25/n*100);
const altP=Math.round(alt25/n*100);
const kgvP=Math.round(kgVar/n*100);
const kgyP=Math.round(kgYok/n*100);
const ortGol=(toplamGol/n).toFixed(1);

let h='<div class="analiz-baslik">📊 '+oranTuru+' = '+oranDeger.toFixed(2)+' (±'+tolerans.toFixed(2)+') — '+n+' Biten Maç</div>';

// Kartlar
h+='<div class="analiz-grid">';
h+='<div class="analiz-kart"><div class="ak-baslik">Toplam Maç</div><div class="ak-deger">'+n+'</div><div class="ak-alt">Biten maçlar</div></div>';
h+='<div class="analiz-kart"><div class="ak-baslik">Ort. Gol</div><div class="ak-deger">'+ortGol+'</div><div class="ak-alt">maç başı</div></div>';
h+='<div class="analiz-kart"><div class="ak-baslik">Üst 2.5</div><div class="ak-deger" style="color:#00c853">%'+ustP+'</div><div class="ak-alt">'+ust25+'/'+n+' maç</div></div>';
h+='<div class="analiz-kart"><div class="ak-baslik">KG Var</div><div class="ak-deger" style="color:#f0b90b">%'+kgvP+'</div><div class="ak-alt">'+kgVar+'/'+n+' maç</div></div>';
h+='</div>';

// MS Barı
h+='<div class="analiz-bar"><div class="analiz-bar-baslik"><span>Maç Sonucu</span></div>';
h+='<div class="analiz-bar-ic">';
if(evP>0)h+='<div class="ab-ev" style="width:'+evP+'%">Ev %'+evP+'</div>';
if(berP>0)h+='<div class="ab-ber" style="width:'+berP+'%">X %'+berP+'</div>';
if(depP>0)h+='<div class="ab-dep" style="width:'+depP+'%">Dep %'+depP+'</div>';
h+='</div></div>';

// Alt/Üst Barı
h+='<div class="analiz-bar"><div class="analiz-bar-baslik"><span>Alt/Üst 2.5</span></div>';
h+='<div class="analiz-bar-ic">';
h+='<div class="ab-dep" style="width:'+altP+'%">Alt %'+altP+'</div>';
h+='<div class="ab-ev" style="width:'+ustP+'%">Üst %'+ustP+'</div>';
h+='</div></div>';

// KG Barı
h+='<div class="analiz-bar"><div class="analiz-bar-baslik"><span>Karşılıklı Gol</span></div>';
h+='<div class="analiz-bar-ic">';
h+='<div class="ab-ev" style="width:'+kgvP+'%">Var %'+kgvP+'</div>';
h+='<div class="ab-dep" style="width:'+kgyP+'%">Yok %'+kgyP+'</div>';
h+='</div></div>';

// İY Barı
const iyEvP=Math.round(iy_ev/n*100),iyBerP=Math.round(iy_ber/n*100),iyDepP=Math.round(iy_dep/n*100);
h+='<div class="analiz-bar"><div class="analiz-bar-baslik"><span>İlk Yarı Sonucu</span></div>';
h+='<div class="analiz-bar-ic">';
if(iyEvP>0)h+='<div class="ab-ev" style="width:'+iyEvP+'%">Ev %'+iyEvP+'</div>';
if(iyBerP>0)h+='<div class="ab-ber" style="width:'+iyBerP+'%">X %'+iyBerP+'</div>';
if(iyDepP>0)h+='<div class="ab-dep" style="width:'+iyDepP+'%">Dep %'+iyDepP+'</div>';
h+='</div></div>';

// Detay tablosu
h+='<div class="analiz-baslik" style="margin-top:15px">📋 Maç Detayları</div>';
h+='<div class="analiz-maclar">';
bitenMaclar.forEach(m=>{
const se=m.skor_ev||0,sd=m.skor_dep||0;
let skorClass="berabere";
if(se>sd)skorClass="ev-kazandi";else if(sd>se)skorClass="dep-kazandi";
h+='<div class="analiz-mac">';
h+='<div class="am-takim">'+m.ev_sahibi+' - '+m.deplasman+'</div>';
h+='<div class="am-skor '+skorClass+'">'+se+'-'+sd+'</div>';
h+='<div class="am-oran">'+m.oranlar[oranTuru]+'</div>';
h+='<div class="am-tarih">'+m.tarih+'</div>';
h+='</div>'});
h+='</div>';

document.getElementById("analizSonuc").innerHTML=h}

yukle();
</script>
</body>
</html>
