<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İddaa Oranları - Analiz & Bülten</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0d1117;color:#e6e6e6;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1f2e,#0d1117);padding:12px 20px;border-bottom:2px solid #00c853;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.header h1{font-size:20px;color:#00c853}
.header .info{font-size:11px;color:#666;text-align:right}
.main-tabs{display:flex;background:#161b22;border-bottom:1px solid #21262d}
.main-tab{flex:1;text-align:center;padding:10px;cursor:pointer;font-size:13px;font-weight:600;color:#888;border-bottom:3px solid transparent}
.main-tab:hover{color:#e6e6e6;background:#1a2233}
.main-tab.aktif{color:#00c853;border-bottom-color:#00c853;background:#0d1117}
.tab-icerik{display:none}.tab-icerik.aktif{display:block}
.stats-bar{background:#161b22;padding:8px 15px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid #21262d}
.si{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:6px 12px;display:flex;gap:6px;align-items:center}
.si .sv{font-size:15px;font-weight:700;color:#00c853}
.si .sl{font-size:10px;color:#888}
.filters{background:#161b22;padding:10px 15px;border-bottom:1px solid #21262d}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}.fr:last-child{margin-bottom:0}
.filters input,.filters select{background:#0d1117;color:#e6e6e6;border:1px solid #30363d;padding:6px 8px;border-radius:5px;font-size:11px;outline:none}
.filters input:focus,.filters select:focus{border-color:#00c853}
.filters input[type=text]{min-width:160px;flex:1;max-width:250px}
.filters input[type=number]{width:70px}
.fl{font-size:10px;color:#888;white-space:nowrap}
.fb{font-size:10px;color:#00c853;font-weight:700}
.btn-r{background:#21262d;color:#e6e6e6;border:1px solid #30363d;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:11px}
.btn-a{background:#00c853;color:#0d1117;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:700}
.ofk{background:#0d1117;border:1px solid #21262d;border-radius:5px;padding:6px 10px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.filtre-tag{background:#1a3a1a;border:1px solid #00c853;border-radius:4px;padding:3px 7px;font-size:10px;display:inline-flex;align-items:center;gap:5px;margin:2px}
.filtre-tag .ft-text{color:#00c853}.filtre-tag .ft-sil{color:#e74c3c;cursor:pointer;font-weight:700}
.filtre-listesi{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}

/* TABLO GÖRÜNÜM */
.tablo{width:100%;margin-top:10px}
.gun-baslik{background:#161b22;border:1px solid #21262d;padding:8px 12px;font-size:12px;font-weight:700;color:#00c853;display:flex;justify-content:space-between;border-radius:6px 6px 0 0;margin-top:10px}
.gun-baslik .gc{background:#00c853;color:#0d1117;padding:1px 8px;border-radius:10px;font-size:10px}
.tablo-header{display:grid;grid-template-columns:50px 1fr repeat(13,46px) 24px;background:#1a1f2e;border:1px solid #21262d;padding:4px 0;font-size:8px;color:#888;text-align:center;font-weight:600}
.tablo-header div{padding:2px}
.mac-satir{display:grid;grid-template-columns:50px 1fr repeat(13,46px) 24px;background:#161b22;border:1px solid #21262d;border-top:none;padding:0;align-items:center;font-size:11px;transition:background .2s}
.mac-satir:hover{background:#1a2233}
.mac-satir:last-child{border-radius:0 0 6px 6px}
.ms-saat{text-align:center;padding:6px 2px;display:flex;flex-direction:column}
.ms-saat .s{color:#00c853;font-weight:700;font-size:12px}
.ms-saat .t{color:#444;font-size:8px}
.ms-takim{padding:4px 6px;display:flex;flex-direction:column;gap:0;overflow:hidden}
.ms-takim .ev{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-takim .dep{font-size:10px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-takim .skor{color:#f0b90b;font-weight:700;font-size:11px}
.oran-hucre{text-align:center;padding:4px 1px;cursor:default;border-left:1px solid #21262d}
.oran-hucre .ov{font-size:11px;font-weight:700;color:#f0b90b}
.oran-hucre .op{font-size:7px;color:#00c853;display:block}
.oran-hucre:hover{background:#0d1117}
.ma-btn{text-align:center;cursor:pointer;color:#444;font-size:12px;padding:4px}
.ma-btn:hover{color:#00c853}
.ma-btn.open{color:#00c853;transform:rotate(180deg)}

/* DETAY */
.detay-row{display:none;background:#0d1117;border:1px solid #21262d;border-top:none;padding:10px}
.detay-row.acik{display:block}
.dtabs{display:flex;gap:3px;margin-bottom:8px;flex-wrap:wrap}
.dtab{background:#161b22;border:1px solid #21262d;color:#888;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:9px}
.dtab:hover,.dtab.a{background:#00c853;color:#0d1117;border-color:#00c853;font-weight:700}
.dcon{display:none}.dcon.a{display:block}
.dgb{color:#00c853;font-size:10px;font-weight:700;padding:3px 0;border-bottom:1px solid #21262d;margin-bottom:3px}
.ds{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.dor{display:flex;flex-direction:column;align-items:center;background:#161b22;border:1px solid #21262d;border-radius:3px;padding:3px 5px;min-width:55px}
.dor:hover{border-color:#00c853;background:#1a2233}
.dor .dl{font-size:7px;color:#888}.dor .dv{font-size:11px;font-weight:700;color:#f0b90b}.dor .dp{font-size:7px;color:#00c853}

/* ANALİZ */
.analiz-panel{background:#161b22;padding:15px;margin:10px 15px;border-radius:8px;border:1px solid #21262d}
.analiz-baslik{font-size:14px;color:#00c853;font-weight:700;margin-bottom:12px}
.analiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.ak{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:12px;text-align:center}
.ak .akb{font-size:10px;color:#888;margin-bottom:4px}.ak .akd{font-size:24px;font-weight:700;color:#f0b90b}.ak .aka{font-size:10px;color:#00c853;margin-top:2px}
.abar{margin-bottom:10px}
.abar-b{font-size:11px;color:#ccc;margin-bottom:3px}
.abar-ic{background:#21262d;height:22px;border-radius:4px;overflow:hidden;display:flex}
.ab-ev{background:#00c853;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#0d1117}
.ab-ber{background:#f0b90b;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#0d1117}
.ab-dep{background:#e74c3c;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.amac{background:#0d1117;border:1px solid #21262d;border-radius:5px;padding:6px 10px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.amac .amt{flex:1}.amac .ams{font-weight:700;font-size:13px;min-width:45px;text-align:center}
.ams.ek{color:#00c853}.ams.b{color:#f0b90b}.ams.dk{color:#e74c3c}
.amac .amo{color:#f0b90b;min-width:70px;text-align:right;font-size:10px}
.amac .amd{color:#555;min-width:70px;text-align:right;font-size:10px}
.analiz-yok{text-align:center;padding:25px;color:#666;font-size:12px}
.air{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.air input,.air select{background:#0d1117;color:#e6e6e6;border:1px solid #30363d;padding:7px 10px;border-radius:5px;font-size:12px;outline:none}
.air input[type=number]{width:75px}
.loading{text-align:center;padding:60px}
.spinner{width:35px;height:35px;border:3px solid #21262d;border-top:3px solid #00c853;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.bos{text-align:center;padding:30px;color:#666;font-size:13px}
.footer{background:#161b22;border-top:1px solid #21262d;padding:10px 15px;text-align:center;font-size:10px;color:#444;margin-top:15px}

@media(max-width:900px){
.tablo-header,.mac-satir{grid-template-columns:45px 1fr repeat(7,42px) 22px}
.tablo-header div:nth-child(n+11),.mac-satir .oran-hucre:nth-child(n+11){display:none}
.tablo-header div:nth-child(n+11){display:none}
}
@media(max-width:600px){
.tablo-header,.mac-satir{grid-template-columns:40px 1fr repeat(5,38px) 20px}
.tablo-header div:nth-child(n+9),.mac-satir .oran-hucre:nth-child(n+9){display:none}
.tablo-header div:nth-child(n+9){display:none}
.header h1{font-size:16px}.fr,.air{flex-direction:column;align-items:stretch}
.filters input[type=text]{max-width:100%;width:100%}.ofk{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="header"><h1>⚽ İddaa Oranları & Analiz</h1><div class="info" id="info">Yükleniyor...</div></div>
<div class="main-tabs"><div class="main-tab aktif" onclick="mainTab(0)">📋 Bülten</div><div class="main-tab" onclick="mainTab(1)">📊 Oran Analizi</div></div>

<div class="tab-icerik aktif" id="tab0">
<div class="stats-bar" id="statsBar"></div>
<div class="filters">
<div class="fr">
<input type="text" id="aramaInput" placeholder="🔍 Takım/lig ara..." oninput="filtrele()">
<select id="tarihSelect" onchange="filtrele()"><option value="">📅 Tüm Tarihler</option></select>
<select id="ligSelect" onchange="filtrele()"><option value="">🏆 Tüm Ligler</option></select>
<select id="durumSelect" onchange="filtrele()"><option value="">📌 Tümü</option><option value="baslamadi">Başlamadı</option><option value="bitti">Bitti</option></select>
<select id="siralama" onchange="filtrele()"><option value="tarih">Tarihe Göre</option><option value="ms1a">MS1↑</option><option value="ms1d">MS1↓</option><option value="ms2a">MS2↑</option><option value="ms2d">MS2↓</option><option value="usta">Üst↑</option><option value="alta">Alt↑</option></select>
<button class="btn-r" onclick="resetFiltre()">↺</button>
</div>
<div class="fr">
<span class="fb">Oran=</span>
<div class="ofk">
<select id="oranTuru"><option value="">Tür...</option>
<optgroup label="MS"><option value="Maç Sonucu_1">MS1</option><option value="Maç Sonucu_0">MSX</option><option value="Maç Sonucu_2">MS2</option></optgroup>
<optgroup label="A/Ü"><option value="Alt/Üst 2.5_Alt">Alt2.5</option><option value="Alt/Üst 2.5_Üst">Üst2.5</option><option value="İlk Yarı Alt/Üst 1.5_Alt">İYA1.5</option><option value="İlk Yarı Alt/Üst 1.5_Üst">İYÜ1.5</option></optgroup>
<optgroup label="KG"><option value="Karşılıklı Gol_Var">KGV</option><option value="Karşılıklı Gol_Yok">KGY</option><option value="İlk Yarı Karşılıklı Gol_Var">İYKG</option></optgroup>
<optgroup label="İY"><option value="İlk Yarı Sonucu_1">İY1</option><option value="İlk Yarı Sonucu_0">İYX</option><option value="İlk Yarı Sonucu_2">İY2</option></optgroup>
<optgroup label="Kmb"><option value="Her İki Yarıda da Üst 1.5_Evet">2YÜ1.5</option><option value="Maç Sonucu ve Karşılıklı Gol_1 ve Var">1+KGV</option><option value="Maç Sonucu ve Karşılıklı Gol_2 ve Var">2+KGV</option><option value="İlk Yarı ve İkinci Yarıda Karşılıklı Gol Olur_Evet / Evet">2YKG</option></optgroup>
</select>
<span class="fl">=</span><input type="number" id="oranDeger" step="0.01" placeholder="Oran">
<button class="btn-a" onclick="filtreEkle()">+</button><button class="btn-r" onclick="filtreTemizle()">✕</button>
</div>
</div>
<div class="filtre-listesi" id="filtreListesi"></div>
</div>
<div class="container" id="container"><div class="loading"><div class="spinner"></div><p>Yükleniyor...</p></div></div>
</div>

<div class="tab-icerik" id="tab1">
<div class="analiz-panel">
<div class="analiz-baslik">📊 Oran Analizi — Biten Maç İstatistikleri</div>
<p style="color:#888;font-size:11px;margin-bottom:8px">Birden fazla filtre ekleyin (VE koşulu). Eşittir filtre.</p>
<div class="air">
<select id="analizOranTuru">
<optgroup label="MS"><option value="Maç Sonucu_1">MS1</option><option value="Maç Sonucu_0">MSX</option><option value="Maç Sonucu_2">MS2</option></optgroup>
<optgroup label="A/Ü"><option value="Alt/Üst 2.5_Alt">Alt2.5</option><option value="Alt/Üst 2.5_Üst">Üst2.5</option><option value="İlk Yarı Alt/Üst 1.5_Alt">İYA1.5</option><option value="İlk Yarı Alt/Üst 1.5_Üst">İYÜ1.5</option></optgroup>
<optgroup label="KG"><option value="Karşılıklı Gol_Var">KGV</option><option value="Karşılıklı Gol_Yok">KGY</option><option value="İlk Yarı Karşılıklı Gol_Var">İYKG</option><option value="İkinci Yarı Karşılıklı Gol_Var">2YKG</option></optgroup>
<optgroup label="İY"><option value="İlk Yarı Sonucu_1">İY1</option><option value="İlk Yarı Sonucu_0">İYX</option><option value="İlk Yarı Sonucu_2">İY2</option></optgroup>
<optgroup label="Kmb"><option value="Her İki Yarıda da Üst 1.5_Evet">2YÜ1.5</option><option value="Maç Sonucu ve Karşılıklı Gol_1 ve Var">1+KGV</option><option value="Maç Sonucu ve Karşılıklı Gol_0 ve Var">X+KGV</option><option value="Maç Sonucu ve Karşılıklı Gol_2 ve Var">2+KGV</option><option value="Maç Sonucu ve Karşılıklı Gol_1 ve Yok">1+KGY</option><option value="Maç Sonucu ve Karşılıklı Gol_2 ve Yok">2+KGY</option><option value="İlk Yarı ve İkinci Yarıda Karşılıklı Gol Olur_Evet / Evet">2YKG E/E</option><option value="İlk Yarı ve İkinci Yarıda Karşılıklı Gol Olur_Hayır / Hayır">2YKG H/H</option></optgroup>
</select>
<span class="fl">=</span><input type="number" id="analizOranDeger" step="0.01" placeholder="Oran">
<button class="btn-a" onclick="analizFiltreEkle()">+ Ekle</button>
<button class="btn-a" onclick="analizYap()">🔍 Analiz</button>
<button class="btn-r" onclick="analizFiltreTemizle()">Temizle</button>
</div>
<div class="filtre-listesi" id="analizFiltreListesi"></div>
<div id="analizSonuc"><div class="analiz-yok">👆 Filtre ekle → Analiz Et</div></div>
</div>
</div>
<div class="footer" id="footer"></div>

<script>
const JSON_URL="https://raw.githubusercontent.com/yusufkocbiotek-sketch/iddiayusuf/main/public/data/mac.json";
const GECMIS_URL="https://raw.githubusercontent.com/yusufkocbiotek-sketch/iddiayusuf/main/public/data/gecmis_maclar.json";
let tumMaclar=[],gecmisMaclar=[],bultenFiltreler=[],analizFiltreler=[];

async function yukle(){try{const r=await fetch(JSON_URL+"?t="+Date.now());const d=await r.json();tumMaclar=d.matches||[];document.getElementById("info").innerHTML="Son: "+new Date(d.updated).toLocaleString("tr-TR")+"<br>iddaa.com";tarihleriDoldur();ligleriDoldur();filtrele();gecmisYukle()}catch(e){document.getElementById("container").innerHTML='<div class="hata">'+e.message+'</div>'}}

async function gecmisYukle(){try{const r=await fetch(GECMIS_URL+"?t="+Date.now());const d=await r.json();gecmisMaclar=d.matches||[];document.getElementById("info").innerHTML+="<br>Gecmis: "+gecmisMaclar.length+" mac"}catch(e){}}

function tarihleriDoldur(){const t=[...new Set(tumMaclar.map(m=>m.tarih))].sort();const s=document.getElementById("tarihSelect");t.forEach(tarih=>{const o=document.createElement("option");o.value=tarih;const d=new Date(tarih);o.textContent=d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"short"});s.appendChild(o)})}
function ligleriDoldur(){const l=[...new Set(tumMaclar.map(m=>m.lig||"").filter(x=>x.trim()))].sort();const s=document.getElementById("ligSelect");l.forEach(lig=>{const o=document.createElement("option");o.value=lig;o.textContent=lig;s.appendChild(o)})}
function pct(o){return o&&o>0?Math.round(1/o*10000)/100:0}
function mainTab(i){document.querySelectorAll(".main-tab").forEach((t,j)=>t.classList.toggle("aktif",j===i));document.querySelectorAll(".tab-icerik").forEach((t,j)=>t.classList.toggle("aktif",j===i))}
function KA(t){const m={"Maç Sonucu_1":"MS1","Maç Sonucu_0":"MSX","Maç Sonucu_2":"MS2","Alt/Üst 2.5_Alt":"Alt","Alt/Üst 2.5_Üst":"Üst","Karşılıklı Gol_Var":"KGV","Karşılıklı Gol_Yok":"KGY","İlk Yarı Sonucu_1":"İY1","İlk Yarı Sonucu_0":"İYX","İlk Yarı Sonucu_2":"İY2","İlk Yarı Alt/Üst 1.5_Alt":"İYA","İlk Yarı Alt/Üst 1.5_Üst":"İYÜ","İlk Yarı Karşılıklı Gol_Var":"İYKG","İkinci Yarı Karşılıklı Gol_Var":"2YKG","Her İki Yarıda da Üst 1.5_Evet":"2YÜ","Maç Sonucu ve Karşılıklı Gol_1 ve Var":"1KG","Maç Sonucu ve Karşılıklı Gol_0 ve Var":"XKG","Maç Sonucu ve Karşılıklı Gol_2 ve Var":"2KG","Maç Sonucu ve Karşılıklı Gol_1 ve Yok":"1KY","Maç Sonucu ve Karşılıklı Gol_2 ve Yok":"2KY","İlk Yarı ve İkinci Yarıda Karşılıklı Gol Olur_Evet / Evet":"EE","İlk Yarı ve İkinci Yarıda Karşılıklı Gol Olur_Hayır / Hayır":"HH"};return m[t]||t.substring(0,8)}

function filtreEkle(){const t=document.getElementById("oranTuru").value;const d=parseFloat(document.getElementById("oranDeger").value);if(!t||!d)return;bultenFiltreler.push({tur:t,deger:d});document.getElementById("oranDeger").value="";fListeGoster();filtrele()}
function filtreSil(i){bultenFiltreler.splice(i,1);fListeGoster();filtrele()}
function filtreTemizle(){bultenFiltreler=[];fListeGoster();filtrele()}
function fListeGoster(){document.getElementById("filtreListesi").innerHTML=bultenFiltreler.map((f,i)=>'<div class="filtre-tag"><span class="ft-text">'+KA(f.tur)+'='+f.deger+'</span><span class="ft-sil" onclick="filtreSil('+i+')">X</span></div>').join("")}

function filtrele(){
const ar=document.getElementById("aramaInput").value.toLowerCase();
const ta=document.getElementById("tarihSelect").value;
const li=document.getElementById("ligSelect").value;
const du=document.getElementById("durumSelect").value;
const si=document.getElementById("siralama").value;
let s=tumMaclar.filter(m=>{
if(ar&&!m.ev_sahibi.toLowerCase().includes(ar)&&!m.deplasman.toLowerCase().includes(ar)&&!(m.lig||"").toLowerCase().includes(ar))return false;
if(ta&&m.tarih!==ta)return false;if(li&&(m.lig||"")!==li)return false;if(du&&m.durum!==du)return false;
for(const f of bultenFiltreler){const v=m.oranlar[f.tur];if(!v||Math.abs(v-f.deger)>0.009)return false}return true});
const g=v=>v||99;
if(si==="ms1a")s.sort((a,b)=>g(a.oranlar["Maç Sonucu_1"])-g(b.oranlar["Maç Sonucu_1"]));
else if(si==="ms1d")s.sort((a,b)=>g(b.oranlar["Maç Sonucu_1"])-g(a.oranlar["Maç Sonucu_1"]));
else if(si==="ms2a")s.sort((a,b)=>g(a.oranlar["Maç Sonucu_2"])-g(b.oranlar["Maç Sonucu_2"]));
else if(si==="ms2d")s.sort((a,b)=>g(b.oranlar["Maç Sonucu_2"])-g(a.oranlar["Maç Sonucu_2"]));
else if(si==="usta")s.sort((a,b)=>g(a.oranlar["Alt/Üst 2.5_Üst"])-g(b.oranlar["Alt/Üst 2.5_Üst"]));
else if(si==="alta")s.sort((a,b)=>g(a.oranlar["Alt/Üst 2.5_Alt"])-g(b.oranlar["Alt/Üst 2.5_Alt"]));
else s.sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));
statsGoster(s);render(s)}

function resetFiltre(){document.getElementById("aramaInput").value="";["tarihSelect","ligSelect","durumSelect"].forEach(id=>document.getElementById(id).value="");document.getElementById("siralama").value="tarih";bultenFiltreler=[];fListeGoster();filtrele()}

function statsGoster(m){const to=m.reduce((t,x)=>t+Object.keys(x.oranlar).length,0);const bi=m.filter(x=>x.durum==="bitti").length;
document.getElementById("statsBar").innerHTML='<div class="si"><div class="sv">'+m.length+'</div><div class="sl">Mac</div></div><div class="si"><div class="sv">'+to.toLocaleString()+'</div><div class="sl">Oran</div></div><div class="si"><div class="sv">'+bi+'</div><div class="sl">Biten</div></div><div class="si"><div class="sv">'+(m.length-bi)+'</div><div class="sl">Gelecek</div></div>'}

function OH(v){return v?'<div class="ov">'+v+'</div><div class="op">%'+pct(v)+'</div>':'<div class="ov" style="color:#333">-</div>'}

function render(maclar){
if(!maclar.length){document.getElementById("container").innerHTML='<div class="bos">Sonuc yok</div>';return}
const grp={};maclar.forEach(m=>{if(!grp[m.tarih])grp[m.tarih]=[];grp[m.tarih].push(m)});
let h="";
Object.keys(grp).sort().forEach(tarih=>{
const gm=grp[tarih];const d=new Date(tarih);
h+='<div class="gun-h">'+d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"long"})+'<span class="gc">'+gm.length+'</span></div>';
h+='<div class="tablo-header"><div>Saat</div><div style="text-align:left">Mac</div><div>MS1</div><div>MSX</div><div>MS2</div><div>Alt</div><div>Ust</div><div>KGV</div><div>KGY</div><div>IY1</div><div>IYX</div><div>IY2</div><div>IYA</div><div>IYU</div><div>V</div></div>';
gm.forEach((m,idx)=>{
const o=m.oranlar;const id="d"+tarih.replace(/-/g,"")+idx;
const skorTxt=m.durum==="bitti"?' <span style="color:#f0b90b;font-weight:700"> MS: '+m.skor_ev+'-'+m.skor_dep+' | İY: '+m.skor_1y_ev+'-'+m.skor_1y_dep+'</span>':' <span style="color:#555"> MS: - | İY: -</span>';
h+='<div class="mac-satir">';
h+='<div class="ms-saat"><span class="s">'+m.saat+'</span><span class="t">#'+(m.mac_kodu||"")+'</span></div>';
h+='<div class="ms-takim"><span class="ev">'+m.ev_sahibi+skorTxt+'</span><span class="dep">'+m.deplasman+'</span></div>';
const keys=["Maç Sonucu_1","Maç Sonucu_0","Maç Sonucu_2","Alt/Üst 2.5_Alt","Alt/Üst 2.5_Üst","Karşılıklı Gol_Var","Karşılıklı Gol_Yok","İlk Yarı Sonucu_1","İlk Yarı Sonucu_0","İlk Yarı Sonucu_2","İlk Yarı Alt/Üst 1.5_Alt","İlk Yarı Alt/Üst 1.5_Üst","İlk Yarı Karşılıklı Gol_Var"];
keys.forEach(k=>{h+='<div class="oran-hucre">'+OH(o[k])+'</div>'});
h+='<div class="ma-btn" id="aw'+id+'" onclick="dtoggle(\''+id+'\')">V</div>';
h+='</div>';
h+='<div class="detay-row" id="'+id+'">';
const gr={};Object.keys(o).forEach(k=>{if(k==="Handikap")return;const ps=k.split("_");let g=ps.length>1?ps[0]:"Genel";const l=ps.length>1?ps.slice(1).join(" "):ps[0];if(!gr[g])gr[g]=[];gr[g].push({l:l,v:o[k],p:pct(o[k])})});
const gn=Object.keys(gr);
h+='<div class="dtabs">';gn.forEach((g,i)=>h+='<div class="dtab'+(i===0?" a":"")+'" onclick="tc(\''+id+'\','+i+')">'+g+' ('+gr[g].length+')</div>');h+='</div>';
gn.forEach((g,i)=>{h+='<div class="dcon'+(i===0?" a":"")+'" id="'+id+'t'+i+'"><div class="dgb">'+g+'</div><div class="ds">';
gr[g].forEach(item=>{h+='<div class="dor"><span class="dl">'+item.l+'</span><span class="dv">'+item.v+'</span>';if(item.p>0&&item.p<100)h+='<span class="dp">%'+item.p+'</span>';h+='</div>'});h+='</div></div>'});
h+='</div>'})});
document.getElementById("container").innerHTML=h;document.getElementById("footer").textContent=maclar.length+" mac | iddaa.com"}

function dtoggle(id){document.getElementById(id).classList.toggle("acik");document.getElementById("aw"+id).classList.toggle("open")}
function tc(id,ti){const p=document.getElementById(id);p.querySelectorAll(".dtab").forEach((t,i)=>t.classList.toggle("a",i===ti));p.querySelectorAll(".dcon").forEach((c,i)=>c.classList.toggle("a",i===ti))}

function analizFiltreEkle(){const t=document.getElementById("analizOranTuru").value;const d=parseFloat(document.getElementById("analizOranDeger").value);if(!t||!d)return;analizFiltreler.push({tur:t,deger:d});document.getElementById("analizOranDeger").value="";afGoster()}
function analizFiltreSil(i){analizFiltreler.splice(i,1);afGoster()}
function analizFiltreTemizle(){analizFiltreler=[];afGoster();document.getElementById("analizSonuc").innerHTML='<div class="analiz-yok">Filtre ekle</div>'}
function afGoster(){document.getElementById("analizFiltreListesi").innerHTML=analizFiltreler.map((f,i)=>'<div class="filtre-tag"><span class="ft-text">'+KA(f.tur)+'='+f.deger+'</span><span class="ft-sil" onclick="analizFiltreSil('+i+')">X</span></div>').join("")}

function analizYap(){
if(!analizFiltreler.length){document.getElementById("analizSonuc").innerHTML='<div class="analiz-yok">Filtre ekleyin</div>';return}
const hepsi=tumMaclar.concat(gecmisMaclar);
const bm=hepsi.filter(m=>{if(m.durum!=="bitti")return false;for(const f of analizFiltreler){const v=m.oranlar[f.tur];if(!v||Math.abs(v-f.deger)>0.009)return false}return true});
if(!bm.length){document.getElementById("analizSonuc").innerHTML='<div class="analiz-yok">Eslesenmaç yok ('+hepsi.length+' mac tarandı)</div>';return}
let ek=0,be=0,dk=0,u25=0,a25=0,kgv=0,kgy=0,iye=0,iyb=0,iyd=0,tg=0;
bm.forEach(m=>{const se=m.skor_ev||0,sd=m.skor_dep||0,t=se+sd;tg+=t;if(se>sd)ek++;else if(se===sd)be++;else dk++;if(t>2.5)u25++;else a25++;if(se>0&&sd>0)kgv++;else kgy++;const ise=m.skor_1y_ev||0,isd=m.skor_1y_dep||0;if(ise>isd)iye++;else if(ise===isd)iyb++;else iyd++});
const n=bm.length,P=v=>Math.round(v/n*100);
const fs=analizFiltreler.map(f=>KA(f.tur)+"="+f.deger).join(" & ");
let h='<div class="analiz-baslik">'+fs+' — '+n+' Mac ('+hepsi.length+' tarandı)</div>';
h+='<div class="analiz-grid">';
h+='<div class="ak"><div class="akb">Mac</div><div class="akd">'+n+'</div></div>';
h+='<div class="ak"><div class="akb">Ort Gol</div><div class="akd">'+(tg/n).toFixed(1)+'</div></div>';
h+='<div class="ak"><div class="akb">Ust2.5</div><div class="akd" style="color:#00c853">%'+P(u25)+'</div><div class="aka">'+u25+'/'+n+'</div></div>';
h+='<div class="ak"><div class="akb">KG Var</div><div class="akd" style="color:#f0b90b">%'+P(kgv)+'</div><div class="aka">'+kgv+'/'+n+'</div></div>';
h+='<div class="ak"><div class="akb">Ev Kazandı</div><div class="akd" style="color:#00c853">%'+P(ek)+'</div><div class="aka">'+ek+'/'+n+'</div></div>';
h+='<div class="ak"><div class="akb">Berabere</div><div class="akd" style="color:#f0b90b">%'+P(be)+'</div><div class="aka">'+be+'/'+n+'</div></div>';
h+='</div>';
h+=bar("Mac Sonucu","Ev%"+P(ek),P(ek),"X%"+P(be),P(be),"Dep%"+P(dk),P(dk));
h+=bar("Alt/Ust","Alt%"+P(a25),P(a25),"",0,"Ust%"+P(u25),P(u25));
h+=bar("KG","Var%"+P(kgv),P(kgv),"",0,"Yok%"+P(kgy),P(kgy));
h+=bar("IY","Ev%"+P(iye),P(iye),"X%"+P(iyb),P(iyb),"Dep%"+P(iyd),P(iyd));
h+='<div class="analiz-baslik" style="margin-top:12px">Maclar (ilk 50)</div>';
bm.slice(0,50).forEach(m=>{const se=m.skor_ev||0,sd=m.skor_dep||0;let sc="b";if(se>sd)sc="ek";else if(sd>se)sc="dk";
const oi=analizFiltreler.map(f=>KA(f.tur)+":"+m.oranlar[f.tur]).join(" | ");
h+='<div class="amac"><div class="amt">'+m.ev_sahibi+' - '+m.deplasman+'</div><div class="ams '+sc+'">'+se+'-'+sd+'</div><div class="amo">'+oi+'</div><div class="amd">'+m.tarih+'</div></div>'});
if(bm.length>50)h+='<div class="analiz-yok">... ve '+(bm.length-50)+' mac daha</div>';
document.getElementById("analizSonuc").innerHTML=h}

function bar(t,l1,w1,l2,w2,l3,w3){let h='<div class="abar"><div class="abar-b">'+t+'</div><div class="abar-ic">';if(w1>0)h+='<div class="ab-ev" style="width:'+w1+'%">'+l1+'</div>';if(w2>0)h+='<div class="ab-ber" style="width:'+w2+'%">'+l2+'</div>';if(w3>0)h+='<div class="ab-dep" style="width:'+w3+'%">'+l3+'</div>';return h+'</div></div>'}

yukle();

</script>
</body>
</html>
