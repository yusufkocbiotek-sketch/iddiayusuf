<style>
  /* GENEL STİLLER */
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #eee; margin: 0; padding: 0; }

  .loading, .bos, .hata { text-align: center; padding: 40px; color: #888; }
  .spinner { border: 4px solid #333; border-top: 4px solid #00c853; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .analiz-panel { background: #1e1e1e; padding: 15px; border-radius: 8px; }
  .analiz-baslik { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #00c853; }
  .air { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
  .k2-panel { background: #252525; padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid #333; }
  .k2-baslik { font-weight: bold; color: #f0b90b; margin-bottom: 5px; }
  .k2-aciklama { font-size: 11px; color: #888; margin-bottom: 10px; }
  .k2-row { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .k2-badge { font-size: 10px; color: #666; margin-top: 5px; font-style: italic; }
  #analizSonuc { margin-top: 15px; }
  .analiz-yok { text-align: center; color: #555; padding: 20px; border: 1px dashed #333; border-radius: 8px; }

  .stats-bar { display: flex; gap: 15px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
  .si { background: #1e1e1e; padding: 8px 12px; border-radius: 6px; text-align: center; min-width: 70px; border: 1px solid #333; }

  /* ============================================ */
  /* YENİ: AKILLI KOMBİNE TABLOSU (SCROLL FIX)    */

  #kesifContainer {
    overflow-x: auto !important; /* Zorunlu yatay kaydırma */

  /* Scrollbar Kalınlaştırdık */

  #kesifContainer::-webkit-scrollbar-thumb:hover { background: #00c853; }

  .tablo-header, .mac-satir {

}

}

  }

  .tablo-header {

    top: 0;

  /* Sabit Sol Bölüm */
  .ms-sabit-bolum {
    display: flex;

  /* Renkler */
  .bg-green { background-color: #063b22 !important; }
  .text-green { color: #00e676 !important; text-shadow: 0 0 8px rgba(0,230,118,0.6); }

  .text-yellow { color: #ffd600 !important; }

<body>

<div class="header">
  <h1>⚽ Stratejik Kombine Analiz</h1>
  <div class="info" id="info">Yükleniyor...</div>
</div>

<div class="main-tabs">
  <div class="main-tab aktif" onclick="mainTab(0)">📋 Bülten</div>
  <div class="main-tab" onclick="mainTab(1)">📊 Oran Analizi</div>
  <div class="main-tab" onclick="mainTab(2)">🧠 Stratejik Kombine</div>
</div>

<!-- 1. SEKME: BÜLTEN -->
<div class="tab-icerik aktif" id="tab0">
  <div class="stats-bar" id="statsBar"></div>
  <div class="filters">
    <div class="fr">
      <input type="text" id="aramaInput" placeholder="🔍 Takım/lig ara..." oninput="filtrele()">
      <select id="tarihSelect" onchange="filtrele()"><option value="">📅 Tüm Tarihler</option></select>
      <select id="ligSelect" onchange="filtrele()"><option value="">🏆 Tüm Ligler</option></select>
      <select id="durumSelect" onchange="filtrele()"><option value="">📌 Tümü</option><option value="baslamadi">Başlamadı</option><option value="bitti">Bitti</option></select>
      <button class="btn-r" onclick="resetFiltre()">↺</button>
    </div>
  </div>
  <div class="container" id="container"><div class="loading"><div class="spinner"></div><p>Yükleniyor...</p></div></div>
</div>

<!-- 2. SEKME: ORAN ANALİZİ -->
<div class="tab-icerik" id="tab1">
  <div class="analiz-panel">
    <div class="analiz-baslik">📊 Oran Analizi</div>
    <div class="air">
      <select id="analizOranTuru">
        <optgroup label="MS"><option value="Maç Sonucu_1">MS1</option><option value="Maç Sonucu_0">MSX</option><option value="Maç Sonucu_2">MS2</option></optgroup>
        <optgroup label="KG"><option value="Karşılıklı Gol_Var">KG VAR</option><option value="Karşılıklı Gol_Yok">KG YOK</option></optgroup>
      </select>
      <span class="fl">=</span><input type="number" id="analizOranDeger" step="0.01" placeholder="Oran">
      <button class="btn-a" onclick="analizYap()">🔍 Analiz</button>
    </div>
    <div id="analizSonuc"><div class="analiz-yok">Oran girip analiz et.</div></div>
  </div>
</div>

<!-- 3. SEKME: STRATEJİK KOMBİNE -->
<div class="tab-icerik" id="tab2">
  <div class="stats-bar" id="kesifStatsBar"></div>
  <div class="filters">
    <div class="fr">
      <input type="text" id="kesifArama" placeholder="🔍 Takım/Lig..." oninput="kombineKesifFiltrele()" style="min-width:150px">
      <select id="kesifLig" onchange="kombineKesifFiltrele()"><option value="">🏆 Tüm Ligler</option></select>
      <select id="kesifDurum" onchange="kombineKesifFiltrele()"><option value="baslamadi">Sadece Oynanacaklar</option><option value="">Tümü</option></select>
    </div>
    <div class="fr">
      <span class="fb">Min Başarı %:</span>
      <input type="number" id="kesifMinYuzde" value="60" min="0" max="100" style="width:50px" onchange="kombineKesifFiltrele()">
      <button class="btn-r" onclick="kesifReset()">↺</button>
    </div>
  </div>
  <div class="container" id="kesifContainer">
    <div class="loading"><div class="spinner"></div><p>Stratejik Analiz Yapılıyor...</p></div>
  </div>
</div>

<script>
const JSON_URL="https://raw.githubusercontent.com/yusufkocbiotek-sketch/iddiayusuf/main/public/data/mac.json";
const GECMIS_URL="https://raw.githubusercontent.com/yusufkocbiotek-sketch/iddiayusuf/main/public/data/gecmis_maclar.json";
let tumMaclar=[],gecmisMaclar=[];

async function yukle(){try{const r=await fetch(JSON_URL+"?t="+Date.now());const d=await r.json();tumMaclar=d.matches||[];document.getElementById("info").innerHTML="Son: "+new Date(d.updated).toLocaleString("tr-TR");tarihleriDoldur();ligleriDoldur();filtrele();gecmisYukle()}catch(e){console.error(e)}}
async function gecmisYukle(){try{const r=await fetch(GECMIS_URL+"?t="+Date.now());gecmisMaclar=(await r.json()).matches||[];}catch(e){}}

function tarihleriDoldur(){const s=document.getElementById("tarihSelect");[...new Set(tumMaclar.map(m=>m.tarih))].sort().forEach(t=>{const o=document.createElement("option");o.value=t;o.textContent=new Date(t).toLocaleDateString("tr-TR");s.appendChild(o);});}
function ligleriDoldur(){const s=document.getElementById("ligSelect");const kl=document.getElementById("kesifLig");[...new Set(tumMaclar.map(m=>m.lig||"").filter(x=>x))].sort().forEach(l=>{const o=document.createElement("option");o.value=l;o.textContent=l;s.appendChild(o.cloneNode(true));if(kl)kl.appendChild(o);});}

function mainTab(i){document.querySelectorAll(".main-tab").forEach((t,idx)=>idx===i?t.classList.add("aktif"):t.classList.remove("aktif"));document.querySelectorAll(".tab-icerik").forEach((t,idx)=>idx===i?t.classList.add("aktif"):t.classList.remove("aktif"));if(i===2)setTimeout(kombineKesifFiltrele,100);}

/* --- BÜLTEN & ANALİZ TEMEL FONKSİYONLAR --- */
function pct(v){return v?Math.round(100/v)+"%":"";}
function dogruOran(m,key){if(!m||m.durum!=="bitti")return false;const se=Number(m.skor_ev||0),sd=Number(m.skor_dep||0);if(key==="Maç Sonucu_1")return se>sd;if(key==="Maç Sonucu_0")return se===sd;if(key==="Maç Sonucu_2")return sd>se;if(key.includes("Var"))return se>0&&sd>0;if(key.includes("Yok"))return !(se>0&&sd>0);return false;}

function filtrele(){const a=(document.getElementById("aramaInput").value||"").toLowerCase();const t=document.getElementById("tarihSelect").value;const l=document.getElementById("ligSelect").value;const d=document.getElementById("durumSelect").value;
let maclar=tumMaclar.filter(m=>{if(a&&!(m.ev_sahibi||"").toLowerCase().includes(a)&&!(m.deplasman||"").toLowerCase().includes(a))return false;if(t&&m.tarih!==t)return false;if(l&&(m.lig||"")!==l)return false;if(d&&m.durum!==d)return false;return true;});
render(maclar);
document.getElementById("statsBar").innerHTML=`<div class="si"><div class="sv">${maclar.length}</div><div class="sl">Maç</div></div>`;
}

function render(maclar){const c=document.getElementById("container");if(!maclar.length){c.innerHTML='<div class="bos">Sonuç yok</div>';return;}const grp={};maclar.forEach(m=>{if(!grp[m.tarih])grp[m.tarih]=[];grp[m.tarih].push(m);});let h="";
Object.keys(grp).sort().forEach(tarih=>{const gm=grp[tarih];h+='<div class="gun-baslik">'+new Date(tarih).toLocaleDateString("tr-TR",{day:'numeric',month:'long'})+' <span>'+gm.length+'</span></div>';
gm.forEach(m=>{const o=m.oranlar||{};const skor=m.durum==="bitti"?` <b style="color:#f0b90b">${m.skor_ev}-${m.skor_dep}</b>`:'';
h+=`<div class="mac-satir"><div class="ms-saat">${m.saat||'-'}</div><div class="ms-takim"><div class="ev">${m.ev_sahibi}${skor}</div><div class="dep">${m.deplasman}</div></div>`;
h+=oranHucre(o["Maç Sonucu_1"],m,"Maç Sonucu_1");h+=oranHucre(o["Maç Sonucu_0"],m,"Maç Sonucu_0");h+=oranHucre(o["Maç Sonucu_2"],m,"Maç Sonucu_2");
h+=oranHucre(o["Karşılıklı Gol_Var"],m,"Karşılıklı Gol_Var");h+=oranHucre(o["Karşılıklı Gol_Yok"],m,"Karşılıklı Gol_Yok");h+='</div>';});});c.innerHTML=h;}

function oranHucre(v,m,key){if(!v)return'<div class="oran-hucre"><div class="ov" style="color:#333">-</div></div>';const cls=dogruOran(m,key)?" dogru":"";return`<div class="oran-hucre${cls}"><div class="ov">${v}</div></div>`;}
function resetFiltre(){document.getElementById("aramaInput").value="";document.getElementById("tarihSelect").value="";document.getElementById("ligSelect").value="";document.getElementById("durumSelect").value="";filtrele();}

function analizYap(){const t=document.getElementById("analizOranTuru").value;const d=document.getElementById("analizOranDeger").value;if(!t||!d)return;
const sonuc=gecmisMaclar.filter(m=>m.durum==="bitti"&&Math.abs(parseFloat(m.oranlar[t]||0)-parseFloat(d))<0.05);
const tutan=sonuc.filter(m=>dogruOran(m,t)).length;const yuzde=sonuc.length?Math.round((tutan/sonuc.length)*100):0;
document.getElementById("analizSonuc").innerHTML=`<h3>Sonuç</h3><p>Benzer Maç: ${sonuc.length} | Tutan: ${tutan} | Başarı: <b style="color:${yuzde>50?'#0f0':'#f00'}">%${yuzde}</b></p>`;}

/* ============================================ */
/* STRATEJİK KOMBİNE MOTORU (YENİ MANTIK)       */
/* ============================================ */

// Sadece işine yarayacak kombinasyonlar
const STRATEJI_LISTESI = [
  // TEMEL GÜVENLİK (Hangisi baskın?)
  { id: "MS1", ad: "MS<br>1", market: "Maç Sonucu_1" },
  { id: "MS0", ad: "MS<br>0", market: "Maç Sonucu_0" },
  { id: "MS2", ad: "MS<br>2", market: "Maç Sonucu_2" },
  
  // ASIL SORU: GOL OLACAK MI?
  { id: "KGV", ad: "KG<br>VAR", market: "Karşılıklı Gol_Var" },
  { id: "KGY", ad: "KG<br>YOK", market: "Karşılıklı Gol_Yok" },
  
  // DETAY: HANGİ YARIDA?
  { id: "IY_KG", ad: "İlk Yarı<br>KG", market: "İlk Yarı Karşılıklı Gol" },
  { id: "2Y_KG_EE", ad: "Her 2 Yarı<br>KG Evet", market: "İlk Yarı ve İkinci Yarıda Karşılıklı Gol Olur Evet / Evet" },
  { id: "2Y_KG_HH", ad: "Her 2 Yarı<br>KG Hayır", market: "İlk Yarı ve İkinci Yarıda Karşılıklı Gol Olur (Hayır / Hayır)" },
  
  // EKSTRA: İY/MS (Maçın kırılma anı)
  { id: "IY_MS", ad: "İY / MS", market: "İlk Yarı / Maç Sonucu" }
];

function kesifDogruMu(m, item) {
  if (!m || m.durum !== "bitti") return false;
  const se = Number(m.skor_ev || 0), sd = Number(m.skor_dep || 0);
  const tg = se + sd;
  const kg = se > 0 && sd > 0;
  const ms = se > sd ? "1" : (se === sd ? "0" : "2");
  
  // İlk Yarı Verileri
  const iy_se = Number(m.iy_skor_ev || 0), iy_sd = Number(m.iy_skor_dep || 0);
  const iy_kg = iy_se > 0 && iy_sd > 0;
  const iy_ms = iy_se > iy_sd ? "1" : (iy_se === iy_sd ? "0" : "2");
  
  // İkinci Yarı Hesaplama
  const iky_se = se - iy_se;
  const iky_sd = sd - iy_sd;
  const iky_kg = iky_se > 0 && iky_sd > 0;

  const id = item.id;

  if (id === "MS1") return ms === "1";
  if (id === "MS0") return ms === "0";
  if (id === "MS2") return ms === "2";
  if (id === "KGV") return kg;
  if (id === "KGY") return !kg;
  
  if (id === "IY_KG") return iy_kg;
  if (id === "2Y_KG_EE") return iy_kg && iky_kg; // Her iki yarıda da gol var
  if (id === "2Y_KG_HH") return !iy_kg && !iky_kg; // Hiçbir yarıda KG yok
  
  if (id === "IY_MS") return true; // Bu market karmaşık olduğu için sadece oran benzerliğine bakacağız

  return false;
}

function kesifYuzdeHesapla(hedefMac, item) {
  const marketAdi = item.market;
  if (!hedefMac.oranlar || hedefMac.oranlar[marketAdi] === undefined) return null;
  
  const hedefOran = parseFloat(hedefMac.oranlar[marketAdi]);
  if (isNaN(hedefOran)) return null;

  // Tolerans %15
  const altSinir = hedefOran * 0.85;
  const ustSinir = hedefOran * 1.15;

  const tumVeri = tumMaclar.concat(gecmisMaclar);
  let benzerMaclar = tumVeri.filter(bm => {
    if (bm.durum !== "bitti") return false;
    if (!bm.oranlar || bm.oranlar[marketAdi] === undefined) return false;
    const bmOran = parseFloat(bm.oranlar[marketAdi]);
    return !isNaN(bmOran) && bmOran >= altSinir && bmOran <= ustSinir;
  });

  if (benzerMaclar.length < 5) return null; // En az 5 örnek lazım

  let tutanSayisi = 0;
  benzerMaclar.forEach(bm => { if (kesifDogruMu(bm, item)) tutanSayisi++; });

  return { yuzde: Math.round((tutanSayisi / benzerMaclar.length) * 100), tutan: tutanSayisi, toplam: benzerMaclar.length };
}

function kombineKesifFiltrele() {
  const arama = (document.getElementById("kesifArama")?.value || "").toLowerCase();
  const lig = document.getElementById("kesifLig")?.value || "";
  const durum = document.getElementById("kesifDurum")?.value || "baslamadi"; // Varsayılan: Oynanacaklar
  const minYuzde = parseInt(document.getElementById("kesifMinYuzde")?.value || "60");

  let maclar = tumMaclar.filter(m => {
    if (arama && !(m.ev_sahibi||"").toLowerCase().includes(arama) && !(m.deplasman||"").toLowerCase().includes(arama)) return false;
    if (lig && (m.lig||"") !== lig) return false;
    if (durum && m.durum !== durum) return false;
    return true;
  });

  // Analiz Yap
  let analizliMaclar = maclar.map(m => {
    let sonuclar = {};
    STRATEJI_LISTESI.forEach(item => { sonuclar[item.id] = kesifYuzdeHesapla(m, item); });
    return { ...m, analiz: sonuclar };
  });

  // Filtrele: En az bir stratejisi yüksek olanları göster
  if (minYuzde > 0) {
    analizliMaclar = analizliMaclar.filter(m => Object.values(m.analiz).some(a => a && a.yuzde >= minYuzde));
  }

  // Sırala: En yüksek yüzdeli maçlar üstte olsun
  analizliMaclar.sort((a, b) => {
    const maxA = Math.max(...Object.values(a.analiz).filter(x=>x).map(x=>x.yuzde), 0);
    const maxB = Math.max(...Object.values(b.analiz).filter(x=>x).map(x=>x.yuzde), 0);
    return maxB - maxA;
  });

  kesifStatsGoster(analizliMaclar);
  kesifRenderGrid(analizliMaclar);
}

function kesifStatsGoster(maclar) {
  const toplam = maclar.length;
  const yuksek = maclar.filter(m => Object.values(m.analiz).some(a => a && a.yuzde >= 80)).length;
  document.getElementById("kesifStatsBar").innerHTML = 
    `<div class="si"><div class="sv">${toplam}</div><div class="sl">Aday</div></div>` +
    `<div class="si"><div class="sv" style="color:#00c853">${yuksek}</div><div class="sl">%80+ Güçlü</div></div>`;
}

function getRenkClass(yuzde) {
  if (yuzde === null || yuzde === undefined) return "bg-gray text-gray";
  if (yuzde >= 80) return "bg-green text-green";
  if (yuzde >= 65) return "bg-yellow text-yellow";
  if (yuzde >= 50) return "bg-orange text-orange";
  return "bg-red text-red";
}

function kesifRenderGrid(maclar) {
  const container = document.getElementById("kesifContainer");
  if (!maclar.length) { container.innerHTML = '<div class="bos">Kriterlere uygun maç bulunamadı.</div>'; return; }

  const grp = {};
  maclar.forEach(m => { if (!grp[m.tarih]) grp[m.tarih] = []; grp[m.tarih].push(m); });

  let h = "";
  Object.keys(grp).sort().forEach(tarih => {
    const gm = grp[tarih];
    const d = new Date(tarih);
    
    // Gün Başlığı
    h += `<div style="padding:10px; background:#1a1a1a; color:#fff; font-weight:bold; border-bottom:1px solid #333;">
            ${d.toLocaleDateString("tr-TR", {day:'numeric', month:'long', weekday:'long'})}
          </div>`;

    // --- TABLO BAŞLIĞI (HEADER) ---
    h += '<div class="tablo-header">';
    // Sol Sabit Kısım (Maç Bilgisi)
    h += '<div class="ms-sabit-bolum" style="background:#1a1a1a; padding:10px; align-items:center;">';
    h += '<div style="width:50px; text-align:center">Saat</div>';
    h += '<div style="width:220px; text-align:left; padding-left:10px">Maç</div>';
    h += '</div>';
    
    // Sağ Kaydırılabilir Kısım (Kombinasyonlar)
    h += '<div class="kesif-kombinasyonlar-alani">';
    STRATEJI_LISTESI.forEach(item => {
      h += `<div class="kesif-hucre bg-gray" style="border-bottom:2px solid #555;"><div class="kh-baslik">${item.ad}</div></div>`;
    });
    h += '</div>';
    h += '</div>'; // Tablo header bitişi

    // --- MAÇ SATIRLARI ---
    gm.forEach(m => {
      // Tek bir satır başlangıcı
      h += '<div class="mac-satir">';
      
      // 1. BÖLÜM: SOL SABİT (Maç Bilgisi)
      h += '<div class="ms-sabit-bolum" style="background:#181818;">';
      h += `<div style="width:50px; text-align:center; font-size:12px; color:#aaa;">${m.saat || "-"}</div>`;
      h += `<div style="width:220px; text-align:left; padding-left:10px; font-size:13px;">
              <div style="color:#fff; margin-bottom:2px; font-weight:bold;">${m.ev_sahibi || "?"}</div>
              <div style="color:#888; font-size:11px;">vs ${m.deplasman || "?"}</div>
            </div>`;
      h += '</div>'; // Sol bölüm bitişi

      // 2. BÖLÜM: SAĞ KAYDIRILABİLİR (Kombinasyonlar)
      h += '<div class="kesif-kombinasyonlar-alani">';
      STRATEJI_LISTESI.forEach(item => {
        const sonuc = m.analiz[item.id];
        if (sonuc && sonuc.yuzde !== null) {
          const rClass = getRenkClass(sonuc.yuzde);
          const tooltip = `${item.ad}: %${sonuc.yuzde} (${sonuc.tutan}/${sonuc.toplam})`;
          h += `<div class="kesif-hucre ${rClass}" title="${tooltip}">
                  <div class="kh-deger">%${sonuc.yuzde}</div>
                </div>`;
        } else {
          h += `<div class="kesif-hucre bg-gray"><div class="kh-deger" style="color:#444">-</div></div>`;
        }
      });
      h += '</div>'; // Sağ bölüm bitişi
      
      h += '</div>'; // Satır bitişi (.mac-satir)
    });
  });
  container.innerHTML = h;
}

  const grp = {};
  maclar.forEach(m => { if (!grp[m.tarih]) grp[m.tarih] = []; grp[m.tarih].push(m); });

  let h = "";
  Object.keys(grp).sort().forEach(tarih => {
    const gm = grp[tarih];
    const d = new Date(tarih);
    
    h += `<div style="padding:10px; background:#1a1a1a; color:#fff; font-weight:bold; border-bottom:1px solid #333;">
            ${d.toLocaleDateString("tr-TR", {day:'numeric', month:'long', weekday:'long'})}
          </div>`;

    // HEADER
    h += '<div class="tablo-header">';
    h += '<div class="ms-sabit-bolum" style="background:#1a1a1a; padding:10px; align-items:center;">';
    h += '<div style="width:50px; text-align:center">Saat</div>';
    h += '<div style="width:220px; text-align:left; padding-left:10px">Maç</div>';
    h += '</div>';
    
    h += '<div class="kesif-kombinasyonlar-alani">';
    STRATEJI_LISTESI.forEach(item => {
      h += `<div class="kesif-hucre bg-gray" style="border-bottom:2px solid #555;"><div class="kh-baslik">${item.ad}</div></div>`;
    });
    h += '</div></div>';

    // ROWS
    gm.forEach(m => {
      h += '<div class="mac-satir">';
      h += '<div class="ms-sabit-bolum" style="background:#181818;">';
      h += `<div style="width:50px; text-align:center; font-size:12px; color:#aaa;">${m.saat || "-"}</div>`;
      h += `<div style="width:220px; text-align:left; padding-left:10px; font-size:13px;">
              <div style="color:#fff; margin-bottom:2px; font-weight:bold;">${m.ev_sahibi || "?"}</div>
              <div style="color:#888; font-size:11px;">vs ${m.deplasman || "?"}</div>
            </div>`;
      h += '</div>';

      h += '<div class="kesif-kombinasyonlar-alani">';
      STRATEJI_LISTESI.forEach(item => {
        const sonuc = m.analiz[item.id];
        if (sonuc && sonuc.yuzde !== null) {
          const rClass = getRenkClass(sonuc.yuzde);
          // Tooltip detayı
          const tooltip = `${item.ad}: %${sonuc.yuzde} Başarı (${sonuc.tutan}/${sonuc.toplam} Benzer Maç)`;
          
          h += `<div class="kesif-hucre ${rClass}" title="${tooltip}">
                  <div class="kh-deger">%${sonuc.yuzde}</div>
                </div>`;
        } else {
          h += `<div class="kesif-hucre bg-gray"><div class="kh-deger" style="color:#444">-</div></div>`;
        }
      });
      h += '</div></div>';
    });
  });
  container.innerHTML = h;
}

function kesifReset() {
  document.getElementById("kesifArama").value = "";
  document.getElementById("kesifLig").value = "";
  document.getElementById("kesifDurum").value = "baslamadi";
  document.getElementById("kesifMinYuzde").value = "60";
  kombineKesifFiltrele();
}

yukle();
</script>
